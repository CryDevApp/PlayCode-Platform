<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Platform - Crea e Gioca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Libreria Ufficiale Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0b1120; color: #f8fafc; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur p-4 sticky top-0 z-30 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-gamepad text-2xl text-emerald-400"></i>
            <h1 class="text-xl font-black tracking-wider text-white">PLAYCODE ARCADE</h1>
        </div>
        <button onclick="toggleModal(true)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl transition flex items-center gap-2 text-sm shadow-lg shadow-emerald-900/30">
            <i class="fa-solid fa-plus"></i> Pubblica un Gioco
        </button>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Colonna Sinistra: Vetrina Giochi (recuperati dal Database) -->
        <section class="lg:col-span-1 flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-fire text-amber-500"></i> Giochi della Community
                </h2>
                <button onclick="caricaTuttiIGiochi()" title="Aggiorna lista" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <!-- Contenitore lista giochi -->
            <div id="lista-giochi" class="flex flex-col gap-3 overflow-y-auto max-h-[78vh] pr-1">
                <div class="text-slate-500 text-sm animate-pulse">Caricamento giochi dal database...</div>
            </div>
        </section>

        <!-- Colonna Destra: Player Sandbox del Gioco Selezionato -->
        <section class="lg:col-span-2 flex flex-col bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden min-h-[500px] shadow-2xl">
            <div class="bg-slate-950 p-3 border-b border-slate-800 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                    <span id="schermo-titolo" class="text-sm font-semibold text-slate-400 ml-2">Nessun gioco selezionato</span>
                </div>
                <button id="btn-fullscreen" onclick="schermoIntero()" class="hidden text-slate-400 hover:text-white px-2 py-1 rounded bg-slate-800 text-xs">
                    <i class="fa-solid fa-expand mr-1"></i> Fullscreen
                </button>
            </div>
            
            <div class="flex-1 relative flex items-center justify-center bg-black" id="container-gioco">
                <p id="placeholder-testo" class="text-slate-500 text-sm">Seleziona un gioco dalla lista a sinistra per iniziare a giocare</p>
                <iframe id="game-frame" class="w-full h-full border-0 absolute inset-0 hidden" sandbox="allow-scripts allow-same-origin allow-pointer-lock"></iframe>
            </div>
        </section>

    </main>

    <!-- Modal per Scrivere e Salvare il Gioco nel Database -->
    <div id="modal-pubblica" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl p-6 shadow-2xl flex flex-col gap-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-code text-emerald-400"></i> Pubblica il tuo Gioco
                </h3>
                <button onclick="toggleModal(false)" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs font-semibold text-slate-400 uppercase">Titolo del Gioco</label>
                <input id="input-titolo" type="text" placeholder="Es. Zombie Forest Survival" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500 text-sm">
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs font-semibold text-slate-400 uppercase">Nome Autore</label>
                <input id="input-autore" type="text" placeholder="Il tuo nick" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500 text-sm">
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs font-semibold text-slate-400 uppercase">Codice HTML / CSS / JS del Gioco</label>
                <textarea id="input-codice" rows="9" placeholder="Incolla qui tutto il codice del gioco (il contenuto completo del file HTML)..." class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-mono text-xs focus:outline-none focus:border-emerald-500 resize-none"></textarea>
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <button onclick="toggleModal(false)" class="px-4 py-2 rounded-xl text-slate-400 hover:text-white text-sm">Annulla</button>
                <button id="btn-invia" onclick="pubblicaGioco()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Salva e Rendi Pubblico
                </button>
            </div>
        </div>
    </div>

    <!-- LOGICA SUPABASE: SALVATAGGIO E LETTURA -->
    <script>
        // ==========================================
        // 1. CONFIGURAZIONE SUPABASE
        // Sostituisci con i dati del tuo progetto Supabase
        // ==========================================
        const SUPABASE_URL = 'https://gjybttueokadqatdrynk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqeWJ0dHVlb2thZHFhdGRyeW5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5Mzg2NDQsImV4cCI6MjEwODUxNDY0NH0.l_pxaBTb7WP5MHxjZ1ztDhV3jjGK_9VIMN3ETfdZ9YA';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let cacheGiochi = [];

        // ==========================================
        // 2. LETTURA: CARICA TUTTI I GIOCHI AL REFRESH
        // Viene eseguito in automatico all'avvio della pagina
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            caricaTuttiIGiochi();
        });

        async function caricaTuttiIGiochi() {
            const container = document.getElementById('lista-giochi');
            container.innerHTML = '<div class="text-slate-500 text-sm animate-pulse">Caricamento giochi...</div>';

            try {
                // Query a Supabase: ordina i più recenti in alto
                const { data: giochi, error } = await supabase
                    .from('games')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                cacheGiochi = giochi;
                container.innerHTML = '';

                if (!giochi || giochi.length === 0) {
                    container.innerHTML = '<p class="text-slate-500 text-sm">Nessun gioco presente nel database. Sii il primo a pubblicarne uno!</p>';
                    return;
                }

                // Genera le card per ogni gioco presente su Supabase
                giochi.forEach((gioco) => {
                    const dataCreazione = new Date(gioco.created_at).toLocaleDateString('it-IT');
                    const card = document.createElement('div');
                    card.className = "bg-slate-900 border border-slate-800 hover:border-emerald-500/50 p-4 rounded-xl cursor-pointer transition flex justify-between items-center group";
                    card.onclick = () => avviaGioco(gioco.id);

                    card.innerHTML = `
                        <div class="overflow-hidden pr-2">
                            <h4 class="font-bold text-white group-hover:text-emerald-400 transition truncate">${escapeHtml(gioco.title)}</h4>
                            <p class="text-xs text-slate-400 mt-1">di <span class="text-slate-300 font-medium">${escapeHtml(gioco.author || 'Anonimo')}</span> &bull; ${dataCreazione}</p>
                        </div>
                        <button class="bg-slate-800 group-hover:bg-emerald-600 text-white w-9 h-9 rounded-lg flex items-center justify-center transition shrink-0">
                            <i class="fa-solid fa-play text-xs ml-0.5"></i>
                        </button>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Errore lettura database:", err);
                container.innerHTML = `<p class="text-red-400 text-xs">Errore nel caricamento: ${err.message}. Controlla RLS o credenziali Supabase.</p>`;
            }
        }

        // ==========================================
        // 3. SALVATAGGIO: SCRIVI IL GIOCO SU SUPABASE
        // Viene richiamato quando premi "Salva e Rendi Pubblico"
        // ==========================================
        async function pubblicaGioco() {
            const inputTitolo = document.getElementById('input-titolo');
            const inputAutore = document.getElementById('input-autore');
            const inputCodice = document.getElementById('input-codice');
            const btnInvia = document.getElementById('btn-invia');

            const title = inputTitolo.value.trim();
            const author = inputAutore.value.trim() || 'Anonimo';
            const code = inputCodice.value.trim();

            if (!title) {
                alert("Inserisci un titolo per il gioco!");
                return;
            }
            if (!code) {
                alert("Incolla il codice HTML del gioco prima di salvare!");
                return;
            }

            // Disabilita pulsante durante il salvataggio
            btnInvia.disabled = true;
            btnInvia.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvataggio...';

            try {
                // Inserimento permanente nel database di Supabase
                const { data, error } = await supabase
                    .from('games')
                    .insert([
                        { title: title, author: author, code: code }
                    ]);

                if (error) throw error;

                // Reset campi e chiudi modale
                inputTitolo.value = '';
                inputAutore.value = '';
                inputCodice.value = '';
                toggleModal(false);

                // Ricarica subito la lista dal server (il nuovo gioco compare in cima)
                await caricaTuttiIGiochi();

            } catch (err) {
                console.error("Errore salvataggio gioco:", err);
                alert("Impossibile salvare il gioco su Supabase: " + err.message);
            } finally {
                btnInvia.disabled = false;
                btnInvia.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Salva e Rendi Pubblico';
            }
        }

        // ==========================================
        // 4. ESECUZIONE SANDBOX DEL GIOCO
        // ==========================================
        function avviaGioco(id) {
            const gioco = cacheGiochi.find(g => g.id === id);
            if (!gioco) return;

            document.getElementById('schermo-titolo').innerText = `${gioco.title} (di ${gioco.author || 'Anonimo'})`;
            document.getElementById('placeholder-testo').classList.add('hidden');
            document.getElementById('btn-fullscreen').classList.remove('hidden');

            const frame = document.getElementById('game-frame');
            frame.classList.remove('hidden');
            
            // Inietta il codice direttamente nell'iframe isolato
            frame.srcdoc = gioco.code;
        }

        function schermoIntero() {
            const frame = document.getElementById('game-frame');
            if (frame.requestFullscreen) {
                frame.requestFullscreen();
            }
        }

        function toggleModal(apri) {
            const modal = document.getElementById('modal-pubblica');
            if (apri) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function escapeHtml(str) {
            return str ? str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag)) : '';
        }
    </script>
</body>
</html>
